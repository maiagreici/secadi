<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo Semana 3</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#5d6678;--line:#dde1e8;--acc:#1f6f5c;--acc-ink:#fff;--err:#b3261e;--note:#eef5f2;--warn:#fff7e0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151b;--card:#1b2029;--ink:#e8ebf1;--mute:#9aa4b6;--line:#2c3340;--acc:#4cb39a;--acc-ink:#0c1512;--err:#ff8a80;--note:#1c2a26;--warn:#2b2614}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hbar{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.hbar h1{font-size:16px;margin:0;flex:1 1 260px}
.hbar .proto{font-size:12px;color:var(--mute);flex:1 1 100%}
select,input[type=text],input[type=number],input[type=date],textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
header select{width:auto}
textarea{min-height:84px;resize:vertical}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:860px;margin:16px auto 80px;padding:0 16px}
.group{margin:0 0 16px}
.group.top{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.group>h2{font-size:19px;margin:0 0 12px}
.group.sub>h3{font-size:16px;margin:14px 0 8px;color:var(--acc)}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q>label.lab,.q>.lab{display:block;font-weight:600;margin-bottom:4px}
.req{color:var(--err);margin-left:4px}
.hint{color:var(--mute);font-size:14px;margin:0 0 6px}
.note{background:var(--note);border-radius:10px;padding:10px 14px;margin:8px 0;white-space:pre-line}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.opt input{margin-top:5px}
.err{color:var(--err);font-size:14px;margin-top:4px}
.q.bad input[type=text],.q.bad textarea,.q.bad select{border-color:var(--err)}
.repeat{border:1px dashed var(--line);border-radius:12px;padding:12px;margin:12px 0}
.inst{background:var(--bg);border-radius:10px;padding:8px 12px;margin:10px 0;border:1px solid var(--line)}
.inst .ihead{display:flex;justify-content:space-between;align-items:center;font-weight:600}
table.tl{border-collapse:collapse;width:100%;font-size:14px}.tl th,.tl td{border-bottom:1px solid var(--line);padding:6px;text-align:center}.tl td:first-child,.tl th:first-child{text-align:left}
[hidden]{display:none!important}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .box{background:var(--card);border-radius:14px;padding:22px;max-width:520px}
.overlay h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60}
</style>
</head>
<body>
<header><div class="hbar">

</div></header>

  try{ return !!fn(n=>lookup(ctx,n),selected,countSel,rx,CUR,CN); }catch(e){ console.error(e); return true; }
}

// ---------------------------------------------------------------- árvore
function tree(rows){
  const root={children:[]}, stack=[root];
  rows.forEach(r=>{
    const t=r.type||'';
    if(['start','end','today','deviceid'].includes(t)) return;
    if(t.startsWith('begin_')){ const n={kind:t.slice(6),r,children:[]}; stack[stack.length-1].children.push(n); stack.push(n); }
    else if(t.startsWith('end_')){ stack.pop(); }
    else stack[stack.length-1].children.push({kind:'q',r});
  });
  return root.children;
}

// ---------------------------------------------------------------- construção do DOM
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function reg(e,node,ctx,parent){
  const item={el:e,node,ctx,parent,rel:compile(node.r&&node.r.relevant),name:node.r&&node.r.name};
  registry.push(item); return item;
}
function build(nodes,host,ctx,parentItem,depth){
  nodes.forEach(n=>{
    if(n.kind==='group'){
      const r=n.r, g=el('div','group '+(depth===0?'top':'sub'));
      const skipLabel=['conteudo'].includes(r.name)||!r.label;
      if(!skipLabel) g.appendChild(el(depth===0?'h2':'h3',null,md(r.label)));
      host.appendChild(g);
      const item=reg(g,n,ctx,parentItem);
      if((r.appearance||'').includes('table-list')) buildTable(n,g,ctx,item);
      else build(n.children,g,ctx,item,depth+(r.name==='conteudo'?0:1));
    } else if(n.kind==='repeat'){
      buildRepeat(n,host,ctx,parentItem);
    } else buildQ(n,host,ctx,parentItem);
  });
}
function buildRepeat(n,host,ctx,parentItem){
  const r=n.r, box=el('div','repeat'); const isFicha=r.name==='risco'; const unid=isFicha?'Ficha':'Item'; box.appendChild(el('div','lab',md(r.label)));
  const list=el('div'); box.appendChild(list); host.appendChild(box);
  const item=reg(box,n,ctx,parentItem);
  ctx.reps=ctx.reps||{}; const arr=ctx.reps[r.name]=[];
  const add=()=>{
    const ic={vals:{},hid:{},parent:ctx,reps:{}}; arr.push(ic);
    const inst=el('div','inst'), head=el('div','ihead'); const idx=arr.length;
    head.innerHTML='<span>'+unid+' '+idx+'</span>'; const rm=el('button',null,'Remover'); rm.type='button';
    rm.onclick=()=>{ if(arr.length<2) return toast('É preciso manter ao menos uma ficha.'); const k=arr.indexOf(ic); arr.splice(k,1);
      registry=registry.filter(x=>!inst.contains(x.el)); inst.remove(); [...list.children].forEach((c,i)=>c.querySelector('.ihead span').textContent=unid+' '+(i+1)); update(); };
    head.appendChild(rm); inst.appendChild(head); list.appendChild(inst);
    build(n.children,inst,ic,item,2); update();
  };
  const b=el('button','primary',isFicha?'+ Adicionar ficha':'+ Adicionar'); b.type='button'; b.onclick=add; box.appendChild(b);
  add();
}
function optionsOf(list){ return (DATA[cur].choices[list]||[]); }
function buildQ(n,host,ctx,parentItem){
  const r=n.r, q=el('div','q'); host.appendChild(q);
  const item=reg(q,n,ctx,parentItem); item.type=r.type;
  if(r.type==='note'){ q.className='note'; q.innerHTML=md(r.label||''); return; }
  const lab=el('div','lab',md(r.label||'')+(r.required==='true'?'<span class="req" title="obrigatória">*</span>':'')); q.appendChild(lab);
  if(r.hint) q.appendChild(el('div','hint',md(r.hint)));
  const m=/^select_(one|multiple)\s+(\w+)/.exec(r.type);
  const t=r.type;
  item.cons=compile(r.constraint); item.filter=compile(r.choice_filter,true);
  const set=v=>{ ctx.vals[r.name]=v; };
  set('');
  if(m){
    item.multi=m[1]==='multiple'; item.list=m[2]; item.box=el('div'); q.appendChild(item.box); item.cache=null; paintOptions(item,true);
  } else if(t==='text'||t==='integer'||t==='date'){
    const multiline=(r.appearance||'').includes('multiline');
    const inp=multiline?el('textarea'):el('input'); if(!multiline) inp.type=t==='integer'?'number':(t==='date'?'date':'text');
    inp.addEventListener('input',()=>{ set(inp.value); update(); }); item.input=inp; q.appendChild(inp);
  } else if(t==='image'||t==='file'){
    const inp=el('input'); inp.type='file'; if(t==='image') inp.accept='image/*';
    inp.addEventListener('change',()=>{ set(inp.files[0]?inp.files[0].name:''); update(); }); item.input=inp; q.appendChild(inp);
  } else { q.appendChild(el('div','hint','(tipo não suportado no protótipo: '+esc(t)+')')); }
  const e=el('div','err'); e.hidden=true; q.appendChild(e); item.errEl=e;
}
function allowedOptions(item){
  let opts=optionsOf(item.list);
  if(item.filter) opts=opts.filter(o=>evalExpr(item.filter,item.ctx,undefined,o[0]));
  return opts;
}
function paintOptions(item,force){
  const opts=allowedOptions(item), key=opts.map(o=>o[0]).join('|');
  if(!force && item.cache===key) return; item.cache=key;
  const r=item.node.r, ctx=item.ctx, box=item.box; box.innerHTML='';
  const old=String(ctx.vals[r.name]||'').split(' ').filter(Boolean).filter(v=>opts.some(o=>o[0]===v));
  const uid='f'+Math.random().toString(36).slice(2,8);
  const setv=a=>{ ctx.vals[r.name]=a.join(' '); update(); };
  if(!item.multi && opts.length>7){
    const s=el('select'); s.appendChild(new Option('— selecione —',''));
    opts.forEach(o=>s.appendChild(new Option(o[1],o[0]))); s.value=old[0]||''; s.onchange=()=>setv(s.value?[s.value]:[]); box.appendChild(s);
  } else {
    opts.forEach(o=>{
      const lab=el('label','opt'), i=el('input'); i.type=item.multi?'checkbox':'radio'; i.name=uid; i.value=o[0]; i.checked=old.includes(o[0]);
      i.onchange=()=>{ const sel=[...box.querySelectorAll('input:checked')].map(x=>x.value); setv(sel); };
      lab.appendChild(i); lab.appendChild(el('span',null,esc(o[1]))); box.appendChild(lab);
    });
  }
  ctx.vals[r.name]=old.join(' ');
}
function buildTable(n,g,ctx,item){
  const rowsN=n.children.filter(c=>c.kind==='q'); if(!rowsN.length) return;
  const m=/select_(one|multiple)\s+(\w+)/.exec(rowsN[0].r.type); const opts=optionsOf(m[2]);
  const tb=el('table','tl'); const th=el('tr'); th.appendChild(el('th')); opts.forEach(o=>th.appendChild(el('th',null,esc(o[1])))); tb.appendChild(th); g.appendChild(tb);
  rowsN.forEach(c=>{
    const tr=el('tr'); tb.appendChild(tr); const it=reg(tr,c,ctx,item); it.type='table-row';
    tr.appendChild(el('td',null,esc(c.r.label))); ctx.vals[c.r.name]=''; const multi=/multiple/.test(c.r.type); const uid='t'+Math.random().toString(36).slice(2,8);
    opts.forEach(o=>{ const td=el('td'), i=el('input'); i.type=multi?'checkbox':'radio'; i.name=uid; i.value=o[0];
      i.onchange=()=>{ ctx.vals[c.r.name]=[...tr.querySelectorAll('input:checked')].map(x=>x.value).join(' '); update(); }; td.appendChild(i); tr.appendChild(td); });
    it.row=true;
  });
}

// ---------------------------------------------------------------- atualização (relevância, filtros)
function update(){
  for(let pass=0;pass<3;pass++){
    registry.forEach(it=>{
      const par=it.parent?!it.parent.hidden:true;
      let vis=par&&evalExpr(it.rel,it.ctx);
      it.hidden=!vis; it.el.hidden=!vis;
      if(it.name){ it.ctx.hid[it.name]=!vis;
        if(!vis && it.ctx.vals[it.name]){ it.ctx.vals[it.name]=''; clearInput(it); } }
    });
    registry.forEach(it=>{ if(it.filter && !it.hidden) paintOptions(it,false); });
  }
}
function clearInput(it){
  if(it.input){ if(it.input.type==='file') it.input.value=''; else it.input.value=''; }
  if(it.box) paintOptions(it,true);
  if(it.row) it.el.querySelectorAll('input').forEach(i=>i.checked=false);
}

// ---------------------------------------------------------------- validação e envio
function validate(){
  let first=null, n=0;
  registry.forEach(it=>{
    if(!it.name||it.hidden||it.row&&false) return;
    const r=it.node.r; if(!r||!r.type||r.type==='note') return;
    const v=String(it.ctx.vals[it.name]||''); let msg='';
    if(r.required==='true' && !v) msg='Resposta obrigatória.';
    else if(v && it.cons && !evalExpr(it.cons,it.ctx,v)) msg=r.constraint_message||'Valor inválido.';
    if(it.errEl){ it.errEl.hidden=!msg; it.errEl.textContent=msg; }
    it.el.classList.toggle('bad',!!msg);
    if(msg){ n++; if(!first) first=it.el; }
  });
  return {n,first};
}
function collect(ctx){
  const o={};
  Object.keys(ctx.vals).forEach(k=>{ if(ctx.vals[k]!=='' && !ctx.hid[k]) o[k]=ctx.vals[k]; });
  Object.keys(ctx.reps||{}).forEach(k=>{ o[k]=ctx.reps[k].map(collect); });
  return o;
}
function download(){
  const blob=new Blob([JSON.stringify({formulario:DATA[cur].title,gerado_em:new Date().toISOString(),respostas:collect(rootCtx)},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=DATA[cur].id+'_respostas.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function toast(t){ const d=el('div','toast',esc(t)); document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function submit(){
  const v=validate();
  if(v.n){ toast(v.n+' pergunta(s) precisam de atenção.'); v.first.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const ov=el('div','overlay',''); ov.innerHTML='<div class="box"><h2>Submission successful</h2><p>Suas respostas foram registradas neste protótipo. Em um formulário real do Kobo, esta é a mensagem que aparece e a página volta em branco.</p><p><b>Nada foi enviado a nenhum servidor.</b></p><div class="actions"><button class="primary" id="ovBaixar">Baixar respostas (.json)</button><button id="ovVoltar">Voltar ao formulário</button></div></div>';
  document.body.appendChild(ov); ov.querySelector('#ovBaixar').onclick=download; ov.querySelector('#ovVoltar').onclick=()=>ov.remove();
}

// ---------------------------------------------------------------- inicialização
function load(key){
  cur=key; const form=$('#form'); form.innerHTML=''; registry=[]; rootCtx={vals:{},hid:{},parent:null,reps:{}};
  $('#titulo').textContent=DATA[key].title; document.title=DATA[key].title;
  build(tree(DATA[key].rows),form,rootCtx,null,0);
  const act=el('div','actions'); const b=el('button','primary','Enviar'); b.type='button'; b.onclick=submit; act.appendChild(b); form.appendChild(act);
  update();
}
const sel=$('#curso'); Object.keys(DATA).forEach(k=>sel.appendChild(new Option(DATA[k].curso,k)));
sel.onchange=()=>{ if(confirm('Trocar de curso limpa as respostas atuais. Continuar?')) load(sel.value); else sel.value=cur; };
$('#btnBaixar').onclick=download;
$('#btnLimpar').onclick=()=>{ if(confirm('Limpar todas as respostas?')) load(cur); };
form_submit_guard();
function form_submit_guard(){ $('#form').addEventListener('submit',e=>e.preventDefault()); }
load(Object.keys(DATA)[0]);
window.__proto={load,validate,collect,getCtx:()=>rootCtx};
})();
</script>
